name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: ESLint validation
        run: npm run lint

      - name: Prettier validation
        run: npm run format:check

  playwright:
    name: ${{ matrix.name }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web Tests
            project: web
            workers: 2
            artifact: web

          - name: Mobile Tests
            project: mobile
            workers: 2
            artifact: mobile

          - name: API Tests
            project: api
            workers: 2
            artifact: api

          - name: Cross Layer Tests
            project: cross-layer
            workers: 1
            artifact: cross-layer

    env:
      BASE_URL: https://www.demoblaze.com
      API_URL: https://api.demoblaze.com

      UI_USERNAME: ${{ secrets.UI_USERNAME }}
      UI_PASSWORD: ${{ secrets.UI_PASSWORD }}

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.name }}
        run: npx playwright test --project=${{ matrix.project }} --workers=${{ matrix.workers }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.artifact }}
          path: allure-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.artifact }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  combined-allure:
    name: Combined Allure Report
    needs: playwright
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Download all Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: combined-allure-results
          merge-multiple: true

      - name: Verify merged Allure results
        run: |
          echo "Merged Allure result files:"
          find combined-allure-results -type f | head -50
          echo "Total files:"
          find combined-allure-results -type f | wc -l

      - name: Generate combined Allure report
        run: |
          npx allure generate combined-allure-results \
            --clean \
            -o combined-allure-report

      - name: Upload combined Allure report
        uses: actions/upload-artifact@v7
        with:
          name: combined-allure-report
          path: combined-allure-report/
          retention-days: 30
          if-no-files-found: error

      - name: Upload combined Allure results
        uses: actions/upload-artifact@v7
        with:
          name: combined-allure-results
          path: combined-allure-results/
          retention-days: 30
          if-no-files-found: error
